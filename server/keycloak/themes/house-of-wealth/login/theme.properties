# Wealth Pooling D-8 sign-in pages: Keycloak's login theme with the platform's own layout.
parent=keycloak
import=common/keycloak

# login.ftl and register.ftl in this folder replace Keycloak's sign-in and register pages
# with a custom layout, styled only by our own sheet. Every other page (forgot password,
# errors, OTP/WebAuthn steps, etc.) still falls back to the parent "keycloak" theme.
styles=css/house-of-wealth.css
scripts=js/house-of-wealth.js

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ../ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ../ops/redis/certs:/run/redis-certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /run/redis-certs/ca.crt --cert /run/redis-certs/redis.crt --key /run/redis-certs/redis.key -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - redis_password
    volumes:
      - ../ops/redis/certs:/run/redis-certs:ro

  worker:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ../.env.production
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - redis_password
    volumes:
      - ../ops/redis/certs:/run/redis-certs:ro

volumes:
  redis_data:

secrets:
  redis_password:
    file: ../ops/secrets/redis_password

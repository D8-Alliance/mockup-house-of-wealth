# Keycloak for the DigitalOcean staging droplet (see PANDUAN_STAGING_DIGITALOCEAN.md).
# Values come from server/keycloak/.env on the droplet (never committed).
# The Keycloak database lives in the managed PostgreSQL cluster, so nothing is stored here.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      # nginx terminates HTTPS and forwards to this port on localhost only.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Keep Keycloak within its share of a 4 GB droplet.
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Wealth Pooling sign-in pages (Realm settings > Themes > Login theme: house-of-wealth). Restart Keycloak after changing them.
      - ./themes/house-of-wealth:/opt/keycloak/themes/house-of-wealth:ro

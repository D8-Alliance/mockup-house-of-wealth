name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: house_of_wealth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d house_of_wealth_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/house_of_wealth_ci?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RUN_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm --prefix server run prisma:migrate:deploy
      - run: npm --prefix server run typecheck
      - run: npm --prefix server test -- --runInBand
      - run: npm --prefix server run test:integration
      - run: npm run lint
      - run: npm run build
